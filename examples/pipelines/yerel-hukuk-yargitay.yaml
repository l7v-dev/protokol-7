name: yerel-hukuk-yargitay-pipeline
version: 1

actor:
  id: yargitay
  config:
    court: yargitay
    query: "tazminat faiz"
    limit: 50

schedule:
  type: one-time

execution:
  target: local

output:
  format: jsonl
  compression: none

storage:
  backend: drive
  folder_id: "${GOOGLE_DRIVE_LEGAL_FOLDER_ID}"
