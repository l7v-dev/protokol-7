services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scraping_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scraping_platform"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - scraping-platform-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  scraping-platform-postgres:
